<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Satellite Art Timeline</title>
  <style>
   html, body {
  height: 100%;
  margin: 0;
  background-color: #f8f9fa;  /* 柔和浅灰背景 */
  color: #000;
  font-family: "Helvetica Neue", sans-serif;
  overflow: hidden;
}

    #timeline-embed {
      width: 100%;
      height: 100vh;
    }

    /* 页面右上角搜索区域 */
    #searchContainer {
      position: fixed;
      top: 20px;
      right: 25px;
      z-index: 10000;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }

    /* 固定“Search”字样 */
    #searchLabel {
      background-color: #003366; /* 深蓝底 */
      color: white;
      font-weight: bold;
      padding: 0.45em 0.9em;
      border-radius: 20px;
      font-size: 0.9em;
      user-select: none;
    }

    /* 输入框：baby blue 风格 */
    #searchBox {
      padding: 0.45em 0.9em;
      font-size: 0.9em;
      border: none;
      border-radius: 20px;
      outline: none;
      width: 220px;
      background-color: rgba(173, 216, 230, 0.3);
      color: #fff;
      transition: background-color 0.2s, width 0.2s;
    }

    #searchBox::placeholder {
      color: #e0f7ff;
    }

    #searchBox:focus {
      background-color: rgba(173, 216, 230, 0.6);
      width: 260px;
    }

    #searchResult {
      margin-top: 6px;
      font-size: 0.8em;
      color: #a6dfff;
      text-align: right;
      position: absolute;
      top: 50px;
      right: 25px;
    }
 .tl-attribution, .tl-credit, .tl-timenav-title, .tl-storyslider p {
  display: none !important;
  visibility: hidden !important;
  opacity: 0 !important;
  height: 0 !important;
}

  <!-- TimelineJS -->
  <script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>
  <link rel="stylesheet" href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css">
</head>
<body>
<a href="index.html"
   style="
      position: fixed;
      top: 1.2vw;
      left: 2vw;
      color: #cccccc;
      text-decoration: none;
      font-weight: 600;
      background: rgba(255,255,255,0.05);
      padding: 0.5em 1em;
      border-radius: 0.6em;
      font-size: clamp(12px, 1.2vw, 18px);  /* 随屏幕大小缩放字体 */
      transition: background 0.3s, color 0.3s;
      z-index: 999999999;
      pointer-events: auto;">
  ← Back to Index
</a>
  
</a>
 <!-- 固定右上角搜索栏（响应式） -->
<div id="searchContainer">
  <div id="searchLabel">Search</div>
  <input type="text" id="searchBox" placeholder="Type to search..." />
</div>
<div id="searchResult"></div>

<style>
  /* 搜索容器：右上角固定，自动适配屏幕 */
  #searchContainer {
    position: fixed;
    top: clamp(0.8rem, 1vw, 1.5rem);
    right: clamp(1rem, 2vw, 2rem);
    z-index: 10000;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0.6em;
    flex-wrap: wrap;
  }

  /* “Search”标签 */
  #searchLabel {
    background-color: #003366;
    color: white;
    font-weight: bold;
    padding: 0.4em 0.9em;
    border-radius: 1.2em;
    font-size: clamp(0.8em, 1vw, 1em);
    user-select: none;
    white-space: nowrap;
  }

  /* 输入框（随屏幕宽度变化） */
  #searchBox {
    padding: 0.45em 0.9em;
    font-size: clamp(0.8em, 1vw, 1em);
    border: none;
    border-radius: 1.2em;
    outline: none;
    width: clamp(160px, 20vw, 260px);
    background-color: rgba(173, 216, 230, 0.3);
    color: #fff;
    transition: background-color 0.2s, width 0.2s;
  }

  #searchBox::placeholder {
    color: #e0f7ff;
  }

  #searchBox:focus {
    background-color: rgba(173, 216, 230, 0.6);
    width: clamp(180px, 25vw, 280px);
  }

  /* 搜索结果文字 */
  #searchResult {
    position: fixed;
    top: clamp(3.2rem, 4vw, 3.8rem);
    right: clamp(1rem, 2vw, 2rem);
    font-size: clamp(0.7em, 0.9vw, 0.9em);
    color: #a6dfff;
    text-align: right;
  }

  /* 小屏优化：上下排列 */
  @media (max-width: 600px) {
    #searchContainer {
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4em;
    }
    #searchResult {
      top: auto;
      bottom: 10px;
      right: 10px;
      font-size: 0.8em;
    }
  }
</style>

  <!-- 时间线主体 -->
  <div id="timeline-embed"></div>

  <script>
    const jsonUrl = "https://satelliteartarchive.dpdns.org/assets/timeline.json";
    let allEvents = [];
    let timeline;

    async function initTimeline() {
      const response = await fetch(jsonUrl);
      const data = await response.json();
      allEvents = data.events;
      timeline = new TL.Timeline("timeline-embed", data, {
        language: "en",
        timenav_position: "bottom",
        hash_bookmark: true,
        start_at_end: false
      });
    }

    // 搜索逻辑
    document.getElementById('searchBox').addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase().trim();
      const resultBox = document.getElementById('searchResult');

      if (!keyword) {
        resultBox.textContent = '';
        return;
      }

      const matches = allEvents.filter(ev =>
        (ev.text.headline && ev.text.headline.toLowerCase().includes(keyword)) ||
        (ev.text.text && ev.text.text.toLowerCase().includes(keyword)) ||
        (ev.start_date.year && ev.start_date.year.toString().includes(keyword))
      );

      if (matches.length > 0) {
        resultBox.textContent = `${matches.length} result${matches.length > 1 ? 's' : ''}`;
        const firstMatch = matches[0];
        if (timeline) {
          timeline.goToId(firstMatch.unique_id || allEvents.indexOf(firstMatch));
        }
      } else {
        resultBox.textContent = 'No results';
      }
    });

    initTimeline();
  </script>
</body>
</html>
