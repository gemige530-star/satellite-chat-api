<script>


/* =========================
   Language Switch
========================= */


function changeLanguage(lang){


document.querySelectorAll("[data-en]").forEach(function(el){


if(lang==="zh"){

el.textContent = el.dataset.zh;

}else{

el.textContent = el.dataset.en;

}


});



const input=document.getElementById("userInput");


if(input){

if(lang==="zh"){

input.placeholder="询问AI...";

}else{

input.placeholder="Ask AI...";

}

}


}




/* =========================
   AI Chat
========================= */


async function sendMessage(){


const input=document.getElementById("userInput");

const history=document.getElementById("chat-history");

const userMsg=input.value.trim();


if(!userMsg)return;



if(
userMsg.includes("国家轨道艺术家关系图") ||
userMsg.includes("国家、轨道、艺术家关系图") ||
userMsg.toLowerCase().includes("generate country orbit artist graph")
){


window.location.href =
"https://satellite-chat-api.vercel.app/satellite_art_semantic_ACO_interactive.html";


input.value="";

return;

}





const userBubble=document.createElement("div");

userBubble.style.textAlign="right";


userBubble.innerHTML=

`

<div style="
display:inline-block;
background:#0af;
padding:8px 12px;
border-radius:10px;
margin:4px 0;
">

${userMsg}

</div>

`;



history.appendChild(userBubble);


input.value="";




const loading=document.createElement("div");

loading.textContent="AI is typing...";

loading.style.color="#888";

history.appendChild(loading);



try{


const res=await fetch(

"https://satellite-chat-api.vercel.app/api/chat",

{


method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

message:userMsg

})


}

);



const data=await res.json();


loading.remove();



if(data.type==="graph" && data.data){


toggleGraph(data.data);

return;


}





if(data.reply){


const aiBubble=document.createElement("div");


aiBubble.innerHTML=

`

<div style="
display:inline-block;
background:#333;
padding:8px 12px;
border-radius:10px;
margin:4px 0;
max-width:90%;
text-align:justify;
line-height:1.6;
">

${data.reply}

</div>

`;



history.appendChild(aiBubble);


history.scrollTop=history.scrollHeight;


return;


}



const error=document.createElement("div");

error.style.color="red";

error.textContent="AI 返回格式错误";

history.appendChild(error);



}

catch(err){


loading.textContent="Error connecting to AI.";

loading.style.color="red";


console.error(err);


}


}





document

.getElementById("sendBtn")

.addEventListener(

"click",

sendMessage

);



document

.getElementById("userInput")

.addEventListener(

"keypress",

function(e){


if(e.key==="Enter")

sendMessage();


}

);






/* =========================
   Semantic Graph
========================= */


function toggleGraph(graphData){


const container=document.getElementById("graph-container");

const downloadBtn=document.getElementById("downloadGraphBtn");



if(!container)return;



container.style.display="block";

downloadBtn.style.display="inline-block";




const nodes=new vis.DataSet(

(graphData.nodes || []).map(n=>({

id:n.id,

label:n.id,

color:n.type==="keyword"
?"#97c2fc"
:"#4da6ff"

}))


);



const edges=new vis.DataSet(

(graphData.links || []).map(l=>({

from:l.source,

to:l.target,

arrows:"to"


}))


);



const network=new vis.Network(

container,

{

nodes:nodes,

edges:edges

},

{


nodes:{

shape:"dot",

size:12,

font:{

color:"#ffffff"

}

},


edges:{

color:"#888",

smooth:true

},


physics:{

stabilization:true

}


}


);





downloadBtn.onclick=function(){


const canvas=container.querySelector("canvas");


if(!canvas)return;


const link=document.createElement("a");


link.href=canvas.toDataURL("image/png");


link.download="semantic-graph.png";


link.click();



};



}



</script>
