 <script>
  async function sendMessage() {
    const input = document.getElementById("userInput");
    const history = document.getElementById("chat-history");
    const userMsg = input.value.trim();
    if (!userMsg) return;

    // 显示用户消息
    const userBubble = document.createElement("div");
    userBubble.style.textAlign = "right";
    userBubble.innerHTML =
      '<div style="display:inline-block;background:#0af;padding:8px 12px;border-radius:10px;margin:4px 0;">'
      + userMsg +
      "</div>";
    history.appendChild(userBubble);
    input.value = "";

    // 显示 loading
    const loading = document.createElement("div");
    loading.textContent = "AI is typing...";
    loading.style.color = "#888";
    history.appendChild(loading);
    history.scrollTop = history.scrollHeight;

    try {
      const res = await fetch("https://satellite-chat-api.vercel.app/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userMsg })
      });

      const data = await res.json();
      loading.remove();

      // ① 语义图响应：后端返回 { type: "graph", data: { nodes, links } }
      if (data.type === "graph" && data.data) {
        toggleGraph(data.data);
        return; // 不再额外显示文本气泡
      }

      // ② 普通文本响应：{ reply: "..." }
      if (data.reply) {
        const aiBubble = document.createElement("div");
        aiBubble.innerHTML =
          '<div style="display:inline-block;background:#333;padding:8px 12px;border-radius:10px;margin:4px 0;max-width:90%;text-align:justify;text-justify:inter-word;line-height:1.6;">'
          + data.reply +
          "</div>";
        history.appendChild(aiBubble);
        history.scrollTop = history.scrollHeight;
        return;
      }

      // ③ 异常情况：没有 reply / type
      const errorBubble = document.createElement("div");
      errorBubble.style.color = "red";
      errorBubble.textContent = "AI 返回格式不符合预期。";
      history.appendChild(errorBubble);

    } catch (err) {
      loading.textContent = "Error connecting to AI.";
      loading.style.color = "red";
      console.error(err);
    }
  }

  document.getElementById("sendBtn").addEventListener("click", sendMessage);
  document.getElementById("userInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  // 语义图渲染 + 下载
  function toggleGraph(graphData) {
    const container = document.getElementById("graph-container");
    const downloadBtn = document.getElementById("downloadGraphBtn");

    container.style.display = "block";
    downloadBtn.style.display = "inline-block";

    // 后端返回的是 data: { nodes, links }
    const nodes = new vis.DataSet(
      (graphData.nodes || []).map(n => ({
        id: n.id,
        label: n.id,
        color: n.type === "keyword" ? "#97c2fc" : "#4da6ff"
      }))
    );

    const edges = new vis.DataSet(
      (graphData.links || []).map(l => ({
        from: l.source,
        to: l.target,
        arrows: "to"
      }))
    );

    const network = new vis.Network(
      container,
      { nodes, edges },
      {
        nodes: {
          shape: "dot",
          size: 12,
          font: { color: "#ffffff" }
        },
        edges: {
          color: "#888",
          smooth: true
        },
        physics: {
          stabilization: true
        }
      }
    );

    // 下载当前图为 PNG
    downloadBtn.onclick = () => {
      const canvas = container.querySelector("canvas");
      if (!canvas) return;
      const link = document.createElement("a");
      link.href = canvas.toDataURL("image/png");
      link.download = "semantic-graph.png";
      link.click();
    };
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- 柱状图容器 -->
<canvas id="barChart" 
        style="max-width:600px;max-height:400px;margin:60px auto;display:block;">
</canvas>

<script>
async function renderBarChart() {
  try {
    const res = await fetch('satellite_art.json');
    const data = await res.json();

    // 假设每项数据形如：
    // { "title": "The Moon Museum", "year": 1969, "artist": "..." }
    const years = {};
    data.forEach(item => {
      const y = item.year;
      years[y] = (years[y] || 0) + 1;
    });

    const labels = Object.keys(years).sort();
    const values = labels.map(y => years[y]);

    const ctx = document.getElementById('barChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Number of Satellite Artworks',
          data: values,
          backgroundColor: 'rgba(77,166,255,0.7)',
          borderColor: '#4da6ff',
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          x: { title: { display: true, text: 'Year', color: '#fff' }, ticks: { color: '#fff' } },
          y: { title: { display: true, text: 'Count', color: '#fff' }, ticks: { color: '#fff' } }
        },
        plugins: {
          legend: { labels: { color: '#fff' } },
          title: { display: true, text: 'Satellite Artworks by Year', color: '#fff' }
        }
      }
    });
  } catch (err) {
    console.error('Error loading JSON or drawing chart:', err);
  }
}

// 让图表在页面加载完成后渲染
window.addEventListener('load', renderBarChart);
</script>
