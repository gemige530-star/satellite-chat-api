<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Satellite Art Archive</title>
  <style>
    
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }
    nav {
      background-color: #0a0a0a;
      padding: 1em 0;
      box-shadow: 0 0 10px rgba(77,166,255,0.3);
    }
    nav a {
      color: #4da6ff;
      text-decoration: none;
      margin: 0 1.2em;
      font-weight: bold;
      letter-spacing: 0.05em;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }
    nav a:hover {
      color: #9cd6ff;
      text-shadow: 0 0 8px #4da6ff;
    }
    h1 {
      margin-top: 0.8em;
      font-size: 2.6em;
      letter-spacing: 0.1em;
    }
    p {
  font-size: 1.2em;
  opacity: 0.8;
  margin-top: 0.4em;
  text-align: justify;      /* 两端对齐 */
  text-justify: inter-word; /* 按词间距调整 */
  line-height: 1.8;         /* 行距更自然 */
  letter-spacing: 0.05em;   /* 字距微调 */
  margin-left: auto;
  margin-right: auto;
  max-width: 800px;         /* 控制正文宽度，提升阅读体验 */
}
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #0a0a0a;
      opacity: 0.6;
      font-size: 0.9em;
      text-align: center;
      padding: 0.8em 0;
      box-shadow: 0 -2px 8px rgba(77,166,255,0.2);
    }
    /* Chatbox */
    #chat-section {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 320px;
      z-index: 1000;
    }
    #chat-window {
      background: #111;
      border-radius: 10px;
      padding: 10px;
      max-height: 400px;
      overflow-y: auto;
      color: #fff;
      font-family: sans-serif;
      font-size: 14px;
      box-shadow: 0 0 12px rgba(77,166,255,0.3);
    }
    #chat-input-area {
      margin-top: 10px;
      display: flex;
      gap: 6px;
    }
    #userInput {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
      background: #222;
      color: #fff;
    }
    #sendBtn {
      background: #0af;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    #sendBtn:hover {
      background: #09f;
    }
  /* —— 基础弹性与图片自适应 —— */
img { max-width: 100%; height: auto; }

/* 作品卡片容器改成弹性、可换行 */
section[style*="display: flex"] {
  flex-wrap: wrap;
  gap: 1.5em;
  margin: 2em auto;
  width: 90%;
  max-width: 1200px;
}

/* 单卡片最小宽度，自动挤压换行 */
section a {
  flex: 1 1 280px;
  max-width: 360px;
}

/* 聊天框：宽度随视口缩放，避免溢出 */
#chat-section {
  width: min(320px, 92vw);
  right: 2vw;
  bottom: 2vh;
}

/* 输入区：保证按钮不挤压输入框 */
#chat-input-area { display: flex; gap: 8px; }
#userInput { min-width: 0; }

/* —— 断点：平板及以下 —— */
@media (max-width: 1024px) {
  nav { display: flex; flex-wrap: wrap; gap: .5em; justify-content: center; }
}

/* —— 断点：手机竖屏 —— */
@media (max-width: 768px) {
  h1 { font-size: 2rem; }
  p  { font-size: 1rem; }
  #chat-section { width: 95vw; right: 2.5vw; bottom: 10px; }
  #chat-window { max-height: 50vh; }
  footer { font-size: .85em; padding: .6em 0; }
}

/* —— 断点：小手机 —— */
@media (max-width: 480px) {
  nav a { display: inline-block; margin: .2em .4em; }
  section a { flex-basis: 100%; max-width: 100%; }
}

  </style>
</head>

  <nav>

<!-- 可视化图谱区域 -->
<div id="graph-container" style="
  position: fixed;
  bottom: 20px;
  right: 370px;
  width: 400px;
  height: 400px;
  background: rgba(20,20,20,0.9);
  border: 1px solid #4da6ff;
  border-radius: 10px;
  display: none; /* 初始隐藏 */
  z-index: 9999;
"></div>

<!-- 加载 Vis.js -->
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <footer>
    © 2025 Satellite Art Archive · Created by Shirley
  </footer>

  <!-- Chatbox -->
  <section id="chat-section">
  <div id="chat-window">
    <div id="chat-history"></div>
  </div>

  <!-- 输入框和发送按钮整个模块 -->
  <div id="chat-input-area" style="margin-top: 10px; display: flex; gap: 6px;">
    <input id="userInput" type="text" placeholder="Ask AI..." style="
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
      background: #222;
      color: #fff;
    ">
    <button id="sendBtn" style="
      background:#0af;
      color:white;
      border:none;
      border-radius:8px;
      padding:8px 12px;
      cursor:pointer;
    ">
      Send
    </button>
  </div>

  <!-- Show Graph 按钮放在最下方 -->
  <div style="margin-top: 8px; text-align: right;">
    <button id="showGraphBtn" style="
      background:#0af;
      color:white;
      border:none;
      border-radius:8px;
      padding:8px 12px;
      cursor:pointer;
    ">
      🔍 Show Graph
    </button>
  </div>
</section>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const history = document.getElementById("chat-history");
      const userMsg = input.value.trim();
      if (!userMsg) return;

      const userBubble = document.createElement("div");
      userBubble.style.textAlign = "right";
      userBubble.innerHTML = `<div style="display:inline-block;background:#0af;padding:8px 12px;border-radius:10px;margin:4px 0;">${userMsg}</div>`;
      history.appendChild(userBubble);
      input.value = "";

      const loading = document.createElement("div");
      loading.textContent = "AI is typing...";
      loading.style.color = "#888";
      history.appendChild(loading);
      history.scrollTop = history.scrollHeight;

      try {
        const res = await fetch("https://satellite-chat-api.vercel.app/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: userMsg })
        });
        const data = await res.json();
        // 检查 AI 回复中是否包含特定标识，例如 "graph:"
if (data.reply.startsWith("graph:")) {
  const graphData = JSON.parse(data.reply.replace("graph:", ""));
  toggleGraph(graphData); // 调用图谱可视化函数
  return; // 不显示普通聊天消息
}
        loading.remove();

        const aiBubble = document.createElement("div");
       aiBubble.innerHTML = `
  <div style="
    display: inline-block;
    background: #333;
    padding: 8px 12px;
    border-radius: 10px;
    margin: 4px 0;
    max-width: 90%;
    text-align: justify;
    text-justify: inter-word;
    line-height: 1.6;
  ">
    ${data.reply}
  </div>`;
        history.appendChild(aiBubble);
        history.scrollTop = history.scrollHeight;
      } catch (err) {
        loading.textContent = "Error connecting to AI.";
        loading.style.color = "red";
      }
    }

    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    document.getElementById("userInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
    // 显示或隐藏图谱
function toggleGraph(data) {
  const container = document.getElementById("graph-container");
  container.style.display = "block"; // 显示图谱容器

  const nodes = new vis.DataSet(data.nodes);
  const edges = new vis.DataSet(data.edges);

  const network = new vis.Network(container, { nodes, edges }, {
    nodes: { color: "#4da6ff", font: { color: "#fff" } },
    edges: { color: "#888" },
    physics: { stabilization: false }
  });
}
  </script>
